name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv run --frozen --group dev pytest -v
      - name: seccomp integration (skips on runners without user namespaces)
        run: bash tests/seccomp.sh
